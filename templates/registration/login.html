{% extends "base.html" %}
{% block title %}Ingresar | ComensalQR{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Ingresar</h1>
                {% if form.errors %}
                    <div class="cq-banner cq-banner-danger" role="alert">Usuario o contrasena incorrectos.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Usuario</label>
                        <input class="form-control" id="id_username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Contrasena</label>
                        <input class="form-control" id="id_password" name="password" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
